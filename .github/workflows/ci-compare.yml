name: PR Code Compare & Checks

# Runs when YOU initiate a Pull Request on GitHub targeting main,
# or when code is pushed to main. It never auto-creates or auto-merges PRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compare-and-verify:
    name: Compare Changes & Secret Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show changed files in Pull Request
        if: github.event_name == 'pull_request'
        run: |
          echo "Comparing PR branch against base branch (${{ github.base_ref }})..."
          git diff --stat "origin/${{ github.base_ref }}...HEAD"

      - name: Check that no .env secret files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "ERROR: A .env file is tracked in Git! Remove it before merging."
            exit 1
          fi
          echo "No .env secret files are tracked."

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -v

  frontend-checks:
    name: Frontend Lint & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Next.js production build
        run: npm run build
